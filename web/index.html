<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0866f2" data-default="#0866f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2f6fe4" data-default="#2f6fe4" />
    <meta name="description" content="CashG: an academic redesign concept for an e-wallet with trackable support tickets. Not affiliated with GCash." />
    <title>CashG</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        // ?theme=light or ?theme=dark in the address forces a theme for one visit, handy for screenshots.
        // CashG opens in dark until the person picks Light or Device in Profile.
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('cashg-theme') || 'dark';
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
